<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Universidade{% endblock %}</title>
  <style>
    body{font:16px Arial,sans-serif;margin:0;color:#202b3b;background:#f7f9fc}
    header{background:#003da5;color:#fff;padding:16px 24px}
    header a{color:#fff;margin-right:20px;text-decoration:none}
    main{max-width:1060px;margin:28px auto;padding:0 22px}
    .cartao{background:white;border:1px solid #dce3ed;border-radius:8px;padding:20px;margin:16px 0}
    table{border-collapse:collapse;width:100%;background:white}
    th,td{border-bottom:1px solid #dce3ed;text-align:left;padding:11px}
    th{background:#eaf1fb}
    button{cursor:pointer;padding:9px 15px}
    input{padding:9px;border:1px solid #adbacb;border-radius:4px}
    .erro{color:#a31c28}
    nav form{display:inline}
  </style>
</head>
<body>
  <header>
    <nav>
      <strong>Universidade</strong> &nbsp;&nbsp;
      {% if current_user.is_authenticated %}
      <a href="{{ url_for('web.painel') }}">Painel</a>
      <a href="{{ url_for('web.alunos') }}">Alunos</a>
      <a href="{{ url_for('web.disciplinas') }}">Disciplinas</a>
      <a href="{{ url_for('web.matriculas') }}">Matrículas</a>
      <a href="/admin/">Flask-Admin</a>
      <form method="post" action="{{ url_for('logout') }}">
        {{ logout_form.hidden_tag() }}
        <button type="submit">Sair</button>
      </form>
      {% else %}
      <a href="{{ url_for('login') }}">Login</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
