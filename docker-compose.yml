services:
  postgres:
    image: postgres:17-alpine
    profiles: ["Postgres"]
    environment:
      POSTGRES_DB: universidade
      POSTGRES_USER: universidade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U universidade -d universidade"]
      interval: 5s
      timeout: 5s
      retries: 15

  mvc:
    build: ./mvc
    environment:
      DATABASEKIND: ${DATABASEKIND:-Postgres}
      SQLITE_PATH: /dados/universidade.db
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: universidade
      POSTGRES_USER: universidade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no .env}
      DEBUG: "false"
    volumes:
      - sqlite_data:/dados
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  pgdata:
  sqlite_data:
